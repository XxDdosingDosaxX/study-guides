 -18.75)"><rect/><foreignObject width="146.625" height="37.5"><div style="color: rgb(186, 230, 253) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#bae6fd !important" class="nodeLabel "><p>Isolated thrombocytopenia<br />platelets &lt; 100 x10⁹/L</p></span></div></foreignObject></g></g><g class="node default q " id="flowchart-B-1" transform="translate(544.9375, 224.4375)"><polygon points="98.9375,0 197.875,-98.9375 98.9375,-197.875 0,-98.9375" class="label-container" transform="translate(-98.4375, 98.9375)" style="fill:#3b2f14 !important;stroke:#f59e0b !important"/><g class="label" style="color:#fde68a !important" transform="translate(-65.1875, -18.75)"><rect/><foreignObject width="130.375" height="37.5"><div style="color: rgb(253, 230, 138) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fde68a !important" class="nodeLabel "><p>LOOK AT THE SMEAR<br />(mandatory, never skip)</p></span></div></foreignObject></g></g><g class="node default mid " id="flowchart-C-3" transform="translate(116.1640625, 472.75)"><rect class="basic label-container" style="fill:#2a1f3d !important;stroke:#a78bfa !important" x="-108.1640625" y="-43.125" width="216.328125" height="86.25"/><g class="label" style="color:#ddd6fe !important" transform="translate(-78.1640625, -28.125)"><rect/><foreignObject width="156.328125" height="56.25"><div style="color: rgb(221, 214, 254) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#ddd6fe !important" class="nodeLabel "><p>PSEUDO-thrombocytopenia<br />EDTA artifact<br />Repeat in citrate tube</p></span></div></foreignObject></g></g><g class="node default bad " id="flowchart-D-5" transform="translate(404.328125, 472.75)"><rect class="basic label-container" style="fill:#3b1a22 !important;stroke:#f43f5e !important" x="-130" y="-61.875" width="260" height="123.75"/><g class="label" style="color:#fecdd3 !important" transform="translate(-100, -46.875)"><rect/><foreignObject width="200" height="93.75"><div style="color: rgb(254, 205, 211) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fecdd3 !important" class="nodeLabel "><p>THROMBOTIC MICROANGIOPATHY<br />TTP / HUS / DIC<br />EMERGENCY - PLEX, never steroids alone</p></span></div></foreignObject></g></g><g class="node default bad " id="flowchart-E-7" transform="translate(685.546875, 472.75)"><rect class="basic label-container" style="fill:#3b1a22 !important;stroke:#f43f5e !important" x="-101.21875" y="-43.125" width="202.4375" height="86.25"/><g class="label" style="color:#fecdd3 !important" transform="translate(-71.21875, -28.125)"><rect/><foreignObject width="142.4375" height="56.25"><div style="color: rgb(254, 205, 211) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fecdd3 !important" class="nodeLabel "><p>MARROW DISORDER<br />Leukemia / MDS / aplasia<br />Heme referral + biopsy</p></span></div></foreignObject></g></g><g class="node default mid " id="flowchart-F-9" transform="translate(958.2421875, 472.75)"><rect class="basic label-container" style="fill:#2a1f3d !important;stroke:#a78bfa !important" x="-121.4765625" y="-43.125" width="242.953125" height="86.25"/><g class="label" style="color:#ddd6fe !important" transform="translate(-91.4765625, -28.125)"><rect/><foreignObject width="182.953125" height="56.25"><div style="color: rgb(221, 214, 254) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#ddd6fe !important" class="nodeLabel "><p>Screen for SECONDARY causes<br />HIV · HCV · H. pylori · quant Ig<br />ANA/APS, meds, recent heparin</p></span></div></foreignObject></g></g><g class="node default good " id="flowchart-G-11" transform="translate(842.91015625, 646.5)"><rect class="basic label-container" style="fill:#123024 !important;stroke:#34d399 !important" x="-83.953125" y="-33.75" width="167.90625" height="67.5"/><g class="label" style="color:#a7f3d0 !important" transform="translate(-53.953125, -18.75)"><rect/><foreignObject width="107.90625" height="37.5"><div style="color: rgb(167, 243, 208) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#a7f3d0 !important" class="nodeLabel "><p>SECONDARY ITP<br />Treat the driver first</p></span></div></foreignObject></g></g><g class="node default good " id="flowchart-H-13" transform="translate(1073.57421875, 646.5)"><rect class="basic label-container" style="fill:#123024 !important;stroke:#34d399 !important" x="-96.7109375" y="-43.125" width="193.421875" height="86.25"/><g class="label" style="color:#a7f3d0 !important" transform="translate(-66.7109375, -28.125)"><rect/><foreignObject width="133.421875" height="56.25"><div style="color: rgb(167, 243, 208) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#a7f3d0 !important" class="nodeLabel "><p>PRIMARY ITP<br />A diagnosis of exclusion<br />No test confirms it</p></span></div></foreignObject></g></g></g></g></g></svg>
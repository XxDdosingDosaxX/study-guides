h/cilia,<br />sedation, supine position</p></span></div></foreignObject></g></g><g class="node default path " id="flowchart-D-5" transform="translate(266.58203125, 300)"><rect class="basic label-container" style="fill:#3b1220 !important;stroke:#f43f5e !important" x="-88.1640625" y="-34.5" width="176.328125" height="69"/><g class="label" style="color:#ffd7de !important" transform="translate(-58.1640625, -19.5)"><rect/><foreignObject width="116.328125" height="39"><div style="color: rgb(255, 215, 222) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#ffd7de !important" class="nodeLabel "><p>Microaspiration past<br />the ET-tube cuff</p></span></div></foreignObject></g></g><g class="node default path " id="flowchart-E-9" transform="translate(266.58203125, 428.75)"><rect class="basic label-container" style="fill:#3b1220 !important;stroke:#f43f5e !important" x="-130" y="-44.25" width="260" height="88.5"/><g class="label" style="color:#ffd7de !important" transform="translate(-100, -29.25)"><rect/><foreignObject width="200" height="58.5"><div style="color: rgb(255, 215, 222) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#ffd7de !important" class="nodeLabel "><p>Biofilm on tube +<br />bacteria reach distal airways/alveoli</p></span></div></foreignObject></g></g><g class="node default path " id="flowchart-F-11" transform="translate(266.58203125, 557.5)"><rect class="basic label-container" style="fill:#3b1220 !important;stroke:#f43f5e !important" x="-117.8046875" y="-34.5" width="235.609375" height="69"/><g class="label" style="color:#ffd7de !important" transform="translate(-87.8046875, -19.5)"><rect/><foreignObject width="175.609375" height="39"><div style="color: rgb(255, 215, 222) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#ffd7de !important" class="nodeLabel "><p>Alveolar invasion → neutrophil<br />influx, purulent exudate</p></span></div></foreignObject></g></g><g class="node default out " id="flowchart-G-13" transform="translate(128.3125, 676.5)"><rect class="basic label-container" style="fill:#0f2a3b !important;stroke:#38bdf8 !important" x="-120.3125" y="-34.5" width="240.625" height="69"/><g class="label" style="color:#cbeafe !important" transform="translate(-90.3125, -19.5)"><rect/><foreignObject width="180.625" height="39"><div style="color: rgb(203, 234, 254) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#cbeafe !important" class="nodeLabel "><p>Consolidation → V/Q mismatch<br />→ hypoxemia, ↓PaO2/FiO2</p></span></div></foreignObject></g></g><g class="node default out " id="flowchart-H-15" transform="translate(404.8515625, 676.5)"><rect class="basic label-container" style="fill:#0f2a3b !important;stroke:#38bdf8 !important" x="-106.2265625" y="-34.5" width="212.453125" height="69"/><g class="label" style="color:#cbeafe !important" transform="translate(-76.2265625, -19.5)"><rect/><foreignObject width="152.453125" height="39"><div style="color: rgb(203, 234, 254) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#cbeafe !important" class="nodeLabel "><p>Cytokine release → fever,<br />leukocytosis, sepsis/shock</p></span></div></foreignObject></g></g></g></g></g></svg>
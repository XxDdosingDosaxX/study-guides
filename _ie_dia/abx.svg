<svg viewBox="0 0 680 470" role="img" aria-label="Antibiotic target map — which structure in the bacterium each endocarditis drug class attacks">
  <defs>
    <marker id="hit" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--d-line)"/>
    </marker>
  </defs>

  <text x="340" y="22" fill="var(--d-text)" font-size="14.5" font-weight="700" text-anchor="middle">Where each endocarditis drug hits the bug</text>
  <text x="340" y="42" fill="var(--d-muted)" font-size="11.5" text-anchor="middle">Inside a vegetation there are no neutrophils — the drug must kill on its own. Bactericidal, high-dose, for weeks.</text>

  <!-- ===== the bacterium ===== -->
  <ellipse cx="176" cy="248" rx="126" ry="150" fill="var(--d-neutral)" stroke="var(--d-line)" stroke-width="1.5"/>
  <!-- cell wall -->
  <ellipse cx="176" cy="248" rx="118" ry="142" fill="none" stroke="var(--d-green)" stroke-width="9" opacity="0.75"/>
  <!-- cell membrane -->
  <ellipse cx="176" cy="248" rx="104" ry="126" fill="var(--d-bg)" stroke="var(--d-blue)" stroke-width="5" opacity="0.9"/>

  <text x="176" y="120" fill="var(--d-green)" font-size="11.5" font-weight="700" text-anchor="middle">CELL WALL</text>
  <text x="176" y="135" fill="var(--d-muted)" font-size="10" text-anchor="middle">(peptidoglycan)</text>
  <text x="176" y="160" fill="var(--d-blue)" font-size="11.5" font-weight="700" text-anchor="middle">CELL MEMBRANE</text>

  <!-- ribosome -->
  <circle cx="140" cy="238" r="24" fill="var(--d-amber-bg)" stroke="var(--d-amber)" stroke-width="1.6"/>
  <text x="140" y="236" fill="var(--d-amber)" font-size="10.5" font-weight="700" text-anchor="middle">RIBO-</text>
  <text x="140" y="249" fill="var(--d-amber)" font-size="10.5" font-weight="700" text-anchor="middle">SOME</text>

  <!-- DNA / RNA pol -->
  <circle cx="212" cy="300" r="26" fill="var(--d-purple-bg)" stroke="var(--d-purple)" stroke-width="1.6"/>
  <text x="212" y="297" fill="var(--d-purple)" font-size="10" font-weight="700" text-anchor="middle">RNA</text>
  <text x="212" y="310" fill="var(--d-purple)" font-size="10" font-weight="700" text-anchor="middle">POLYM.</text>

  <text x="176" y="360" fill="var(--d-muted)" font-size="10.5" text-anchor="middle">cytoplasm</text>

  <!-- ===== drug callouts ===== -->
  <!-- 1. beta-lactams -> cell wall -->
  <line x1="352" y1="82" x2="292" y2="140" stroke="var(--d-line)" stroke-width="1.3" marker-end="url(#hit)"/>
  <rect x="356" y="62" width="316" height="60" rx="9" fill="var(--d-green-bg)" stroke="var(--d-green)" stroke-width="1.3"/>
  <text x="366" y="80" fill="var(--d-green)" font-size="12" font-weight="700">β-LACTAMS → PBP / transpeptidase</text>
  <text x="366" y="96" fill="var(--d-text)" font-size="10.8">Pen G · ampicillin · nafcillin/oxacillin · cefazolin</text>
  <text x="366" y="111" fill="var(--d-text)" font-size="10.8">ceftriaxone. Block wall cross-linking → lysis.</text>

  <!-- 2. vancomycin -> cell wall substrate -->
  <line x1="352" y1="152" x2="288" y2="182" stroke="var(--d-line)" stroke-width="1.3" marker-end="url(#hit)"/>
  <rect x="356" y="132" width="316" height="46" rx="9" fill="var(--d-green-bg)" stroke="var(--d-green)" stroke-width="1.3"/>
  <text x="366" y="150" fill="var(--d-green)" font-size="12" font-weight="700">VANCOMYCIN → D-Ala-D-Ala</text>
  <text x="366" y="167" fill="var(--d-text)" font-size="10.8">Caps the <tspan font-weight="700">substrate</tspan>, not the enzyme — so β-lactamase can't touch it.</text>

  <!-- 3. daptomycin -> membrane -->
  <line x1="352" y1="212" x2="284" y2="222" stroke="var(--d-line)" stroke-width="1.3" marker-end="url(#hit)"/>
  <rect x="356" y="188" width="316" height="60" rx="9" fill="var(--d-blue-bg)" stroke="var(--d-blue)" stroke-width="1.3"/>
  <text x="366" y="206" fill="var(--d-blue)" font-size="12" font-weight="700">DAPTOMYCIN → membrane</text>
  <text x="366" y="222" fill="var(--d-text)" font-size="10.8">Ca²⁺-dependent depolarization → rapid cidal kill.</text>
  <text x="366" y="238" fill="var(--d-red)" font-size="10.8" font-weight="700">Inactivated by surfactant — never for pneumonia.</text>

  <!-- 4. aminoglycoside -> ribosome -->
  <line x1="352" y1="282" x2="168" y2="264" stroke="var(--d-line)" stroke-width="1.3" marker-end="url(#hit)"/>
  <rect x="356" y="258" width="316" height="60" rx="9" fill="var(--d-amber-bg)" stroke="var(--d-amber)" stroke-width="1.3"/>
  <text x="366" y="276" fill="var(--d-amber)" font-size="12" font-weight="700">GENTAMICIN → 30S ribosome</text>
  <text x="366" y="292" fill="var(--d-text)" font-size="10.8">Can't cross the wall alone. A β-lactam punches the</text>
  <text x="366" y="308" fill="var(--d-text)" font-size="10.8">hole → <tspan font-weight="700" fill="var(--d-amber)">SYNERGY</tspan>. That is the whole point in enterococcus.</text>

  <!-- 5. rifampin -> RNA pol -->
  <line x1="352" y1="348" x2="240" y2="312" stroke="var(--d-line)" stroke-width="1.3" marker-end="url(#hit)"/>
  <rect x="356" y="328" width="316" height="76" rx="9" fill="var(--d-purple-bg)" stroke="var(--d-purple)" stroke-width="1.3"/>
  <text x="366" y="346" fill="var(--d-purple)" font-size="12" font-weight="700">RIFAMPIN → DNA-dep. RNA polymerase</text>
  <text x="366" y="362" fill="var(--d-text)" font-size="10.8">The one drug that penetrates biofilm on <tspan font-weight="700">foreign</tspan></text>
  <text x="366" y="377" fill="var(--d-text)" font-size="10.8"><tspan font-weight="700">material</tspan> → prosthetic valves &amp; devices only.</text>
  <text x="366" y="393" fill="var(--d-red)" font-size="10.8" font-weight="700">NEVER monotherapy (resistance in days).</text>

  <!-- bottom rule -->
  <rect x="20" y="414" width="652" height="46" rx="9" fill="var(--d-red-bg)" stroke="var(--d-red)" stroke-width="1.3"/>
  <text x="346" y="433" fill="var(--d-red)" font-size="12" font-weight="700" text-anchor="middle">The vegetation is an immune sanctuary — avascular, no phagocytes, bacteria dormant at 10⁹–10¹¹ CFU/g.</text>
  <text x="346" y="451" fill="var(--d-text)" font-size="11.5" text-anchor="middle">That is why IE needs BACTERICIDAL drugs, at high dose, IV, for 4–6 weeks — not a 7-day course.</text>
</svg>
